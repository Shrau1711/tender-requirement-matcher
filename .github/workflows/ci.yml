name: CI

on:
  push:
  pull_request:

# No test may call the model: with a limit of 0, any call that is not already saved stops with an error instead of
# spending. The tests never load the local embedding model either (they use fake embeddings; checked by running them
# with an empty model folder and Hugging Face offline), so nothing is downloaded and there is no model cache to keep.
env:
  LLM_MAX_CALLS: "0"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t tender-matcher-backend .
      - name: Build the frontend image
        run: docker build -t tender-matcher-frontend frontend
