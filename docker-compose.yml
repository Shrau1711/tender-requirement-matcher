# Runs both images together:  docker compose up
# Put your key in a file called .env next to this one:  GEMINI_API_KEY=...
services:
  backend:
    image: ${DOCKERHUB_USER:-your-dockerhub-user}/tender-matcher-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-400}
      TENDER_TOKEN_BUDGET: ${TENDER_TOKEN_BUDGET:-1500000}
      LLM_WORKERS: ${LLM_WORKERS:-4}
      # The settings below default to what the saved answers were made with; see "Switching the settings" in the README.
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_THINKING: ${LLM_THINKING:-LOW}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      CHUNKER: ${CHUNKER:-table_rows}
      EMBEDDER: ${EMBEDDER:-bge-small}
      RETRIEVER: ${RETRIEVER:-hybrid}
      VECTOR_SEARCH: ${VECTOR_SEARCH:-exact}
      RERANKER: ${RERANKER:-none}
      EVIDENCE_TOP_K: ${EVIDENCE_TOP_K:-16}
      VECTOR_STORE: ${VECTOR_STORE:-chroma}
      TOKEN_COUNTER: ${TOKEN_COUNTER:-estimate}
      KNOWLEDGE_GRAPH: ${KNOWLEDGE_GRAPH:-off}
    ports:
      - "8000:8000"
    volumes:
      - tender-data:/data
  frontend:
    image: ${DOCKERHUB_USER:-your-dockerhub-user}/tender-matcher-frontend:latest
    build:
      context: frontend
    environment:
      API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  tender-data:
