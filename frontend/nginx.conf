server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # config.js must never be cached: it holds the backend address chosen when the container started.
  location = /config.js { add_header Cache-Control "no-store"; }
  # Built files have hashed names, so they can be cached for a long time.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
